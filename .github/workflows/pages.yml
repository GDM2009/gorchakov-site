name: pages
# Черновой адрес сайта на GitHub Pages: https://gdm2009.github.io/gorchakov-site/
# Пересобирается сам после каждой правки в main и выкладывается в ветку gh-pages (её GitHub Pages и показывает).
# Закрыт от поисковиков (noindex), чтобы не спорить с основным сайтом. Pages не выполняет PHP, поэтому форма здесь отправляется через formsubmit.co.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Сборка под адрес GitHub Pages
        env: {FORM_SERVICE: formsubmit}
        run: node tools/build.js "https://${GITHUB_REPOSITORY_OWNER,,}.github.io" "/${GITHUB_REPOSITORY#*/}"
      - name: Черновик закрыть от поиска, убрать серверные файлы
        run: |
          find novyi-sait -name '*.html' -exec sed -i 's|<head>|<head><meta name="robots" content="noindex, nofollow">|' {} +
          rm -rf novyi-sait/send.php novyi-sait/_data novyi-sait/.htaccess novyi-sait/robots.txt
          touch novyi-sait/.nojekyll
      - name: Выложить в ветку gh-pages
        run: |
          cd novyi-sait
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Черновик сайта из ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
